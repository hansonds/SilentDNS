name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.3)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Work out version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # versionName = what you typed, versionCode = run number (always goes up)
          sed -i -E "s/android:versionName=\"[^\"]*\"/android:versionName=\"$V\"/; s/android:versionCode=\"[0-9]+\"/android:versionCode=\"$((100 + GITHUB_RUN_NUMBER))\"/" app/AndroidManifest.xml
          grep -E "version(Name|Code)" app/AndroidManifest.xml

      - name: Build and sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KS="$RUNNER_TEMP/release.jks" bash tools/build.sh
          mv app/build/SilentDNS.apk "SilentDNS-v${{ steps.v.outputs.version }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: SilentDNS v${{ steps.v.outputs.version }}
          files: SilentDNS-v${{ steps.v.outputs.version }}.apk
          generate_release_notes: true
