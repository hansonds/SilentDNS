name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.3)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" > /dev/null
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar

      - name: Work out version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # versionName = what you typed, versionCode = run number (always goes up)
          sed -i -E "s/android:versionName=\"[^\"]*\"/android:versionName=\"$V\"/; s/android:versionCode=\"[0-9]+\"/android:versionCode=\"$((100 + GITHUB_RUN_NUMBER))\"/" app/AndroidManifest.xml
          grep -E "version(Name|Code)" app/AndroidManifest.xml

      - name: Build and sign
        env:
          # Accepted as repository Secrets (preferred) or as Variables
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS || vars.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS || vars.KS_ALIAS }}
        run: |
          for n in KEYSTORE_BASE64 KS_PASS KS_ALIAS; do
            if [ -n "${!n}" ]; then echo "$n: found"; else echo "::error::$n not found. Add it under Settings > Secrets and variables > Actions > Secrets tab > 'New repository secret' (not Environment secrets)."; MISSING=1; fi
          done
          [ -z "$MISSING" ] || exit 1
          # tolerate spaces / line breaks from copy-paste
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
          KS="$RUNNER_TEMP/release.jks" BUNDLETOOL="$RUNNER_TEMP/bundletool.jar" bash tools/build.sh
          mv app/build/SilentDNS.apk "SilentDNS-v${{ steps.v.outputs.version }}.apk"
          mv app/build/SilentDNS.aab "SilentDNS-v${{ steps.v.outputs.version }}-playstore.aab"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: SilentDNS v${{ steps.v.outputs.version }}
          files: |
            SilentDNS-v${{ steps.v.outputs.version }}.apk
            SilentDNS-v${{ steps.v.outputs.version }}-playstore.aab
          generate_release_notes: true
